<!DOCTYPE html>

<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>New Transaction</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet"/>
<script>
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            colors: {
              "primary": "#13ec5b",
              "background-light": "#f6f8f6",
              "background-dark": "#102216",
            },
            fontFamily: {
              "display": ["Manrope", "sans-serif"]
            },
            borderRadius: {"DEFAULT": "0.25rem", "lg": "0.5rem", "xl": "0.75rem", "full": "9999px"},
          },
        },
      }
    </script>
<style>
      .material-symbols-outlined {
        font-variation-settings:
        'FILL' 0,
        'wght' 400,
        'GRAD' 0,
        'opsz' 24
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background-light dark:bg-background-dark font-display">
<div class="relative flex h-screen min-h-[800px] w-full flex-col justify-end bg-white dark:bg-black group/design-root overflow-x-hidden">
<div class="absolute inset-0 bg-background-light dark:bg-background-dark">
<!-- This is the placeholder for the underlying page content -->
<div class="p-6">
<h1 class="text-2xl font-bold text-slate-800 dark:text-slate-200">My Wallet</h1>
</div>
</div>
<div class="flex absolute top-0 left-0 h-full w-full flex-col justify-end items-stretch bg-black/40 dark:bg-black/60">
<div class="flex flex-col items-stretch bg-background-light dark:bg-background-dark rounded-t-xl">
<div class="flex h-5 w-full items-center justify-center pt-3">
<div class="h-1 w-9 rounded-full bg-slate-300 dark:bg-slate-700"></div>
</div>
<div class="flex justify-between items-center px-4 pt-2">
<div class="w-10 h-10"></div> <!-- Spacer -->
<h3 class="text-slate-900 dark:text-slate-100 tracking-tight text-xl font-bold text-center py-3">New Transaction</h3>
<button class="flex items-center justify-center w-10 h-10 rounded-full hover:bg-slate-200/50 dark:hover:bg-slate-800/50 text-slate-500 dark:text-slate-400">
<span class="material-symbols-outlined text-2xl">close</span>
</button>
</div>
<div class="flex px-4 py-3">
<div class="flex h-12 flex-1 items-center justify-center rounded-xl bg-slate-200/60 dark:bg-slate-800/60 p-1">
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-slate-900 has-[:checked]:shadow-sm has-[:checked]:text-slate-900 has-[:checked]:dark:text-slate-100 text-slate-500 dark:text-slate-400 text-sm font-semibold">
<span class="truncate">Expense</span>
<input checked="" class="invisible w-0" name="transaction-type" type="radio" value="Expense"/>
</label>
<label class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-2 has-[:checked]:bg-white has-[:checked]:dark:bg-slate-900 has-[:checked]:shadow-sm has-[:checked]:text-slate-900 has-[:checked]:dark:text-slate-100 text-slate-500 dark:text-slate-400 text-sm font-semibold">
<span class="truncate">Income</span>
<input class="invisible w-0" name="transaction-type" type="radio" value="Income"/>
</label>
</div>
</div>
<div class="flex flex-col gap-4 px-4 py-3">
<div class="flex flex-col min-w-40 flex-1">
<label class="text-slate-800 dark:text-slate-200 text-sm font-medium pb-2" for="amount">Amount</label>
<div class="relative">
<span class="absolute inset-y-0 left-0 flex items-center pl-4 text-2xl font-semibold text-slate-400 dark:text-slate-500">$</span>
<input class="form-input text-4xl font-bold flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-slate-100 dark:bg-slate-800 focus:border-none h-20 placeholder:text-slate-400 dark:placeholder:text-slate-500 pl-10 pr-4" id="amount" placeholder="0.00" value=""/>
</div>
</div>
<div class="flex flex-col min-w-40 flex-1">
<label class="text-slate-800 dark:text-slate-200 text-sm font-medium pb-2" for="category">Category</label>
<button class="form-select flex w-full min-w-0 flex-1 items-center justify-between overflow-hidden rounded-xl text-left text-slate-500 dark:text-slate-400 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-slate-100 dark:bg-slate-800 focus:border-none h-14 p-4 text-base font-normal" id="category">
<span>Select Category</span>
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">chevron_right</span>
</button>
</div>
<div class="grid grid-cols-2 gap-4">
<div class="flex flex-col min-w-0 flex-1">
<label class="text-slate-800 dark:text-slate-200 text-sm font-medium pb-2" for="date">Date</label>
<button class="form-select flex w-full min-w-0 flex-1 items-center justify-between overflow-hidden rounded-xl text-left text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-slate-100 dark:bg-slate-800 focus:border-none h-14 p-4 text-base font-normal" id="date">
<span>Today</span>
<span class="material-symbols-outlined text-slate-400 dark:text-slate-500">calendar_today</span>
</button>
</div>
<div class="flex flex-col min-w-0 flex-1">
<label class="text-slate-800 dark:text-slate-200 text-sm font-medium pb-2" for="attachment">Attachment</label>
<button class="flex w-full min-w-0 flex-1 items-center justify-center overflow-hidden rounded-xl focus:outline-0 focus:ring-2 focus:ring-primary/50 border-2 border-dashed border-slate-300 dark:border-slate-700 bg-transparent hover:bg-slate-100 dark:hover:bg-slate-800 h-14 p-4 text-base font-normal" id="attachment">
<span class="material-symbols-outlined text-slate-500 dark:text-slate-400">attach_file</span>
</button>
</div>
</div>
<div class="flex flex-col min-w-40 flex-1">
<label class="text-slate-800 dark:text-slate-200 text-sm font-medium pb-2" for="description">Description</label>
<textarea class="form-textarea flex w-full min-w-0 flex-1 resize-none overflow-hidden rounded-xl text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-2 focus:ring-primary/50 border-none bg-slate-100 dark:bg-slate-800 focus:border-none h-24 placeholder:text-slate-400 dark:placeholder:text-slate-500 p-4 text-base font-normal" id="description" placeholder="Add a note (optional)"></textarea>
</div>
</div>
<div class="px-4 pt-4 pb-6">
<button class="flex h-14 w-full items-center justify-center rounded-xl bg-primary px-4 text-center text-base font-bold text-background-dark shadow-sm hover:opacity-90 focus:outline-none focus:ring-2 focus:ring-primary/50 focus:ring-offset-2 dark:focus:ring-offset-background-dark">Add Transaction</button>
</div>
</div>
</div>
</div>
</body></html>
